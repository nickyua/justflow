[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "justflow"
version = "0.1.0"
description = "Durable workflows defined in YAML and executed on Temporal"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "Mykyta Bakunov" },
]
keywords = [
    "temporal",
    "workflow",
    "orchestration",
    "durable-execution",
    "yaml",
    "dsl",
    "justflow",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "temporalio>=1.30.0,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.1,<3",
    "pyyaml>=6.0.3,<7",
    "httpx>=0.26,<1",
    "jsonschema>=4.18,<5",
    "referencing>=0.30,<1",
]

[project.urls]
Documentation = "https://nickyua.github.io/justflow/"
Issues = "https://github.com/nickyua/justflow/issues"
Repository = "https://github.com/nickyua/justflow"
Security = "https://github.com/nickyua/justflow/security/policy"

[project.optional-dependencies]
# Integration dependencies are imported lazily through explicit extras.
aws = ["boto3>=1.36,<2"]
grpc = ["grpcio>=1.75.1,<2"]
postgres = ["asyncpg>=0.31,<1"]
redis = ["redis>=5.0,<9"]
control = ["uvicorn>=0.30,<1"]
admin = ["uvicorn>=0.30,<1", "justflow-admin>=0.1.0,<0.2"]
all = [
    "asyncpg>=0.31,<1",
    "boto3>=1.36,<2",
    "grpcio>=1.75.1,<2",
    "redis>=5.0,<9",
    "uvicorn>=0.30,<1",
    "justflow-admin>=0.1.0,<0.2",
]
dev = [
    "asyncpg>=0.29",
    "boto3>=1.36",
    "grpcio>=1.60",
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "redis>=5.0",
    "mypy>=1.10",
    "openapi-spec-validator==0.7.2",
    "packaging==26.2",
    "ruff==0.16.1",
    "uvicorn>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/justflow"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/justflow",
    ".env.example",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "docs",
    "LICENSE",
    "mkdocs.yml",
    "NOTICE",
    "README.md",
    "SECURITY.md",
    "SUPPORT.md",
    "pyproject.toml",
]

[tool.hatch.build]
exclude = [
    "/.agents",
    "/.claude",
    "/.codegraph",
    "/.codex",
    "/ui/admin/node_modules",
    "/ui/admin/coverage",
    "/docs/scheduling-workflows-spec.md",
    "/.env",
    "/.env.local",
    "/.env.*.local",
    "**/.DS_Store",
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "examples/host_application/src",
    "examples/object_ingestion/src",
    "examples/prime_stats/src",
    "examples/product_onboarding/src",
    "examples/scheduled_reporting/src",
]
asyncio_mode = "auto"
markers = [
    "aws_integration: opt-in network verification against caller-owned AWS infrastructure",
]

[tool.ruff]
required-version = "==0.16.1"
target-version = "py311"
line-length = 100

[tool.coverage.run]
source = ["src/justflow"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
files = [
    "src/justflow",
    "examples/host_application/src",
    "examples/object_ingestion/src",
    "examples/prime_stats/src",
    "examples/product_onboarding/src",
    "examples/scheduled_reporting/src",
    "scripts",
]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "justflow-example-scheduled-reporting"
version = "0.1.0"
description = "Deterministic schedule-triggered reporting example for Justflow"
requires-python = ">=3.11"
dependencies = ["justflow==0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/scheduled_reporting"]

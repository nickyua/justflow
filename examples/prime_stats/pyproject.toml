[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "justflow-example-prime-stats"
version = "0.1.0"
description = "Prime statistics example application for justflow"
requires-python = ">=3.11"
dependencies = ["justflow==0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/prime_stats"]

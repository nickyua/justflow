[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "justflow-example-object-ingestion"
version = "0.1.1"
description = "S3 object-created ingestion example for Justflow"
requires-python = ">=3.11"
dependencies = ["justflow[control]==0.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/object_ingestion"]

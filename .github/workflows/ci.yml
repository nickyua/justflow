name: Quality

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
  PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
  TRIVY_IMAGE: aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Verify the pinned scanner detects the synthetic fixture
        run: |
          expected_leak_exit_code=1
          set +e
          docker run --rm --read-only --tmpfs /tmp:size=16m \
            --volume "$PWD/tests/fixtures/security:/scan:ro" \
            "$GITLEAKS_IMAGE" dir /scan --no-banner --redact \
            --exit-code "$expected_leak_exit_code"
          scanner_exit_code=$?
          set -e
          if [ "$scanner_exit_code" -ne "$expected_leak_exit_code" ]; then
            echo "The secret scanner did not report the expected fixture result" >&2
            exit 1
          fi
      - name: Scan the complete repository history
        run: >-
          docker run --rm --read-only --tmpfs /tmp:size=16m
          --volume "$PWD:/repo:ro"
          "$GITLEAKS_IMAGE" git /repo
          --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14@sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      JUSTFLOW_TEST_POSTGRES_DSN: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            examples/host_application/pyproject.toml
            examples/object_ingestion/pyproject.toml
            examples/prime_stats/pyproject.toml
            examples/product_onboarding/pyproject.toml
            examples/scheduled_reporting/pyproject.toml
            packages/justflow-admin/pyproject.toml
            docs/requirements.txt
            constraints/ci.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/admin/package-lock.json
          package-manager-cache: false
      - run: npm --prefix ui/admin ci
      - run: npm --prefix ui/admin audit --audit-level=high
      - run: >-
          python -m pip install --editable ".[dev]"
          --editable packages/justflow-admin
          --editable examples/host_application
          --editable examples/object_ingestion
          --editable examples/prime_stats
          --editable examples/product_onboarding
          --editable examples/scheduled_reporting
          --requirement docs/requirements.txt
          build
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/temporal-sdk-python-1.30.0
          key: temporal-cli-1.8.1-sdk-python-1.30.0-${{ runner.os }}-${{ runner.arch }}
      - run: make check PY=python
      - run: sha256sum dist/* > dist.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist.sha256
          if-no-files-found: error
          retention-days: 14

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            examples/host_application/pyproject.toml
            examples/object_ingestion/pyproject.toml
            examples/prime_stats/pyproject.toml
            examples/product_onboarding/pyproject.toml
            examples/scheduled_reporting/pyproject.toml
            packages/justflow-admin/pyproject.toml
            constraints/ci.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/admin/package-lock.json
          package-manager-cache: false
      - run: npm --prefix ui/admin ci
      - run: make admin-build
      - run: >-
          python -m pip install --editable ".[dev]"
          --editable packages/justflow-admin
          --editable examples/host_application
          --editable examples/object_ingestion
          --editable examples/prime_stats
          --editable examples/product_onboarding
          --editable examples/scheduled_reporting
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/temporal-sdk-python-1.30.0
          key: temporal-cli-1.8.1-sdk-python-1.30.0-${{ runner.os }}-${{ runner.arch }}
      - run: python -m pytest tests --ignore=tests/integration -q
      - run: python -m pytest tests/integration -q

  minimum-deps:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/justflow-admin/pyproject.toml
            constraints/minimum.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: .
      - name: Install built packages at their direct dependency floors
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints/minimum.txt
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/constraints/minimum.txt
        run: |
          core_wheel=$(find dist -maxdepth 1 -type f -name 'justflow-*.whl')
          admin_wheel=$(find dist -maxdepth 1 -type f -name 'justflow_admin-*.whl')
          python -m pip install packaging==26.2 "${core_wheel}[all]" "$admin_wheel"
          python -m pip check
      - run: python scripts/verify_dependency_contract.py
      - run: python scripts/verify_minimum_environment.py
      - run: python -m justflow --help
      - name: Run the unit suite against minimum dependencies
        if: matrix.python-version == '3.12'
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints/minimum.txt
        run: |
          python -m pip install \
            openapi-spec-validator==0.7.2 \
            pytest==9.0.3 \
            pytest-asyncio==1.3.0 \
            pytest-mock==3.15.1
          python -m pip check
          python -m pytest tests --ignore=tests/integration -q

  containers:
    needs: [quality, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
            constraints/container.txt
      - run: python -m pip install --editable . pip-audit
      - name: Resolve build provenance
        run: echo "BUILD_DATE=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Validate container and vulnerability policy
        run: |
          docker compose config --quiet
          python scripts/validate_vulnerability_exceptions.py \
            --trivy-output /tmp/justflow-trivyignore.yaml
      - name: Build the Justflow base image
        run: >-
          docker build --file docker/Dockerfile --tag justflow:local
          --build-arg SOURCE_REVISION="$GITHUB_SHA"
          --build-arg BUILD_DATE="$BUILD_DATE"
          --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
      - name: Build the downstream reference image
        run: >-
          docker build --file examples/host_application/Dockerfile
          --tag justflow-host-application:local
          --build-arg JUSTFLOW_BASE_IMAGE=justflow:local
          --build-arg SOURCE_REVISION="$GITHUB_SHA"
          --build-arg BUILD_DATE="$BUILD_DATE"
          --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
      - name: Verify image runtime, provenance, history, and filesystem boundaries
        run: python scripts/verify_container_images.py justflow:local justflow-host-application:local
      - name: Audit the resolved installed Python closure
        run: |
          mkdir -p container-artifacts
          docker run --rm --read-only --network none --entrypoint python \
            --volume "$PWD/scripts/export_installed_distributions.py:/audit/export.py:ro" \
            --volume "$PWD/constraints/container.txt:/audit/constraints.txt:ro" \
            justflow:local /audit/export.py --expected /audit/constraints.txt \
            --exclude justflow --exclude justflow-admin \
            > container-artifacts/justflow-requirements.txt
          docker run --rm --read-only --network none --entrypoint python \
            --volume "$PWD/scripts/export_installed_distributions.py:/audit/export.py:ro" \
            --volume "$PWD/constraints/container.txt:/audit/constraints.txt:ro" \
            justflow-host-application:local /audit/export.py --expected /audit/constraints.txt \
            --exclude justflow --exclude justflow-admin \
            --exclude justflow-host-application-example \
            > container-artifacts/host-application-requirements.txt
          python -m pip_audit --strict --disable-pip --no-deps \
            --requirement container-artifacts/justflow-requirements.txt
          python -m pip_audit --strict --disable-pip --no-deps \
            --requirement container-artifacts/host-application-requirements.txt
      - name: Scan both images
        run: |
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            --volume /tmp/justflow-trivyignore.yaml:/ignore.yaml:ro \
            "$TRIVY_IMAGE" image --no-progress --exit-code 1 \
            --severity HIGH,CRITICAL --scanners vuln,secret,misconfig --ignore-unfixed \
            --ignorefile /ignore.yaml justflow:local
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            --volume /tmp/justflow-trivyignore.yaml:/ignore.yaml:ro \
            "$TRIVY_IMAGE" image --no-progress --exit-code 1 \
            --severity HIGH,CRITICAL --scanners vuln,secret,misconfig --ignore-unfixed \
            --ignorefile /ignore.yaml justflow-host-application:local
      - name: Generate both image SBOMs
        run: |
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            --volume "$PWD/container-artifacts:/artifacts" \
            "$TRIVY_IMAGE" image --no-progress --format spdx-json \
            --output /artifacts/justflow.spdx.json justflow:local
          docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            --volume "$PWD/container-artifacts:/artifacts" \
            "$TRIVY_IMAGE" image --no-progress --format spdx-json \
            --output /artifacts/host-application.spdx.json justflow-host-application:local
      - name: Start the isolated local container stack
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Exercise health, metrics, and a workflow through the public API
        run: |
          curl --fail http://127.0.0.1:8080/livez
          curl --fail http://127.0.0.1:8080/readyz
          curl --fail --header 'x-host-subject: local-operator' \
            http://127.0.0.1:8080/metrics
          curl --fail --header 'content-type: application/json' \
            --header 'x-host-subject: local-operator' \
            --data '{"workflow_name":"hello","business_request_id":"container-ci","input":{"subject_ref":"subject-ci"}}' \
            http://127.0.0.1:8080/v1/workflows
          curl --fail --header 'x-host-subject: local-operator' \
            http://127.0.0.1:8080/v1/operations/runs
      - name: Verify graceful role shutdown
        run: docker compose stop --timeout 35 worker api
      - if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-security-artifacts
          path: container-artifacts/
          if-no-files-found: error
          retention-days: 14

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "justflow-admin"
version = "0.1.1"
description = "Optional beta admin panel for Justflow"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Mykyta Bakunov"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["justflow>=0.1.1,<0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/justflow_admin"]

[tool.hatch.build.targets.sdist]
only-include = ["src/justflow_admin", "README.md", "pyproject.toml"]

[tool.hatch.build]
artifacts = ["/src/justflow_admin/assets/dist/**"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="920" viewBox="0 0 1560 920" role="img" aria-labelledby="title description">
  <title id="title">Justflow production services on AWS ECS and Fargate</title>
  <desc id="description">Authenticated clients reach gateway tasks through an application load balancer. Gateway and worker tasks use Temporal over TLS. Regional AWS service labels identify their permitted consumers. Only workers connect to private Redis and application data; workers and the isolated migration task connect to PostgreSQL.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .boundary { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .subnet { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .regional { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .external { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .service { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
      .data-service { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
      .title { font-size: 22px; font-weight: 700; }
      .group-title { font-size: 16px; font-weight: 700; }
      .group-detail { font-size: 12px; fill: #475569; }
      .service-title { font-size: 15px; font-weight: 700; text-anchor: middle; }
      .service-detail { font-size: 12px; text-anchor: middle; fill: #475569; }
      .access-detail { font-size: 11px; text-anchor: middle; fill: #6d28d9; }
      .edge-label { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
      .data-edge { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .data-bus { fill: none; stroke: #2563eb; stroke-width: 2.2; }
      .bridge-edge { fill: none; stroke: #ffffff; stroke-width: 7; }
      .control-edge { fill: none; stroke: #7c3aed; stroke-width: 2.2; marker-end: url(#arrow-purple); }
      .legend { font-size: 12px; fill: #334155; }
    </style>
  </defs>

  <rect width="1560" height="920" fill="#f8fafc"/>
  <text x="30" y="44" class="title">Justflow ECS/Fargate production topology</text>

  <rect x="190" y="90" width="880" height="730" rx="14" class="boundary"/>
  <text x="215" y="125" class="group-title">VPC · private application and data paths</text>

  <rect x="220" y="170" width="220" height="240" rx="10" class="subnet"/>
  <text x="240" y="201" class="group-title">Public subnets · multi-AZ</text>

  <rect x="460" y="170" width="580" height="320" rx="10" class="subnet"/>
  <text x="480" y="201" class="group-title">Private application subnets · multi-AZ</text>

  <rect x="460" y="540" width="580" height="220" rx="10" class="subnet"/>
  <text x="480" y="571" class="group-title">Private data subnets · multi-AZ</text>

  <rect x="220" y="540" width="220" height="220" rx="12" class="subnet"/>
  <text x="330" y="575" class="service-title">Temporal ECS/Fargate</text>
  <text x="330" y="602" class="service-detail">Private subnets · multi-AZ</text>
  <text x="330" y="628" class="service-detail">Frontend · history · matching</text>
  <text x="330" y="650" class="service-detail">Internal frontend + worker</text>
  <text x="330" y="679" class="service-detail">Separate RDS stores:</text>
  <text x="330" y="701" class="service-detail">persistence + SQL visibility</text>
  <text x="330" y="732" class="service-detail">Private frontend · TLS 7233</text>

  <rect x="1110" y="260" width="360" height="560" rx="14" class="regional"/>
  <text x="1135" y="293" class="group-title">Regional AWS services</text>
  <text x="1135" y="314" class="group-detail">private endpoints · IAM and resource policies</text>

  <!-- Primary runtime paths are drawn behind services so they never obscure labels. -->
  <path d="M160 285 H200 V290 H245" class="data-edge"/>
  <path d="M415 290 H500" class="data-edge"/>
  <text x="438" y="280" class="edge-label">HTTP 8080</text>

  <path d="M690 290 H750 V510 H330 V540" class="data-edge"/>
  <path d="M820 290 H750" class="data-bus"/>
  <text x="705" y="480" class="edge-label">TLS 7233</text>

  <path d="M1070 325 H1110" class="control-edge"/>

  <path d="M915 370 V335" class="control-edge"/>

  <path d="M1010 290 H1030 V590" class="data-bus"/>
  <path d="M1030 590 H595 V610" class="data-edge"/>
  <path d="M1030 590 H915 V610" class="data-edge"/>
  <text x="920" y="580" class="edge-label">worker only</text>

  <path d="M595 450 V520 H790 V662 H820" class="bridge-edge"/>
  <path d="M595 450 V520 H790 V662 H820" class="data-edge"/>
  <text x="675" y="510" class="edge-label">migration only</text>

  <rect x="20" y="240" width="140" height="90" rx="10" class="external"/>
  <text x="90" y="276" class="service-title">Authenticated</text>
  <text x="90" y="300" class="service-detail">clients</text>

  <rect x="245" y="245" width="170" height="90" rx="10" class="service"/>
  <text x="330" y="280" class="service-title">ALB + WAF</text>
  <text x="330" y="305" class="service-detail">TLS 443 · private HTTP</text>

  <rect x="500" y="245" width="190" height="90" rx="10" class="service"/>
  <text x="595" y="278" class="service-title">Gateway service</text>
  <text x="595" y="302" class="service-detail">2 fixed Fargate tasks</text>
  <text x="595" y="322" class="service-detail">authentication · scoped APIs</text>

  <rect x="820" y="245" width="190" height="90" rx="10" class="service"/>
  <text x="915" y="278" class="service-title">Worker service</text>
  <text x="915" y="302" class="service-detail">2 fixed Fargate tasks</text>
  <text x="915" y="322" class="service-detail">activities · resources</text>

  <rect x="500" y="370" width="190" height="80" rx="10" class="service"/>
  <text x="595" y="403" class="service-title">Migration task</text>
  <text x="595" y="427" class="service-detail">one-shot · no public IP</text>

  <rect x="820" y="370" width="190" height="80" rx="10" class="service"/>
  <text x="915" y="403" class="service-title">Activation</text>
  <text x="915" y="427" class="service-detail">host binding required</text>

  <rect x="500" y="610" width="190" height="105" rx="10" class="data-service"/>
  <text x="595" y="642" class="service-title">Redis / Valkey</text>
  <text x="595" y="664" class="service-detail">optional replication group</text>
  <text x="595" y="686" class="service-detail">TLS 6379 · failover</text>
  <text x="595" y="706" class="service-detail">private endpoint</text>

  <rect x="820" y="610" width="190" height="105" rx="10" class="data-service"/>
  <text x="915" y="642" class="service-title">PostgreSQL</text>
  <text x="915" y="664" class="service-detail">Aurora or RDS</text>
  <text x="915" y="686" class="service-detail">TLS 5432 · writer</text>
  <text x="915" y="706" class="service-detail">private endpoint</text>

  <rect x="1140" y="335" width="300" height="68" rx="9" class="service"/>
  <text x="1290" y="362" class="service-title">Secrets Manager + KMS</text>
  <text x="1290" y="385" class="access-detail">role-scoped startup injection</text>

  <rect x="1140" y="417" width="300" height="68" rx="9" class="service"/>
  <text x="1290" y="444" class="service-title">S3</text>
  <text x="1290" y="464" class="service-detail">definitions · configuration · archives</text>
  <text x="1290" y="479" class="access-detail">gateway · worker · controller</text>

  <rect x="1140" y="499" width="300" height="68" rx="9" class="service"/>
  <text x="1290" y="526" class="service-title">DynamoDB control table</text>
  <text x="1290" y="546" class="service-detail">configuration + activation · two GSIs</text>
  <text x="1290" y="561" class="access-detail">gateway · worker · controller</text>

  <rect x="1140" y="581" width="300" height="68" rx="9" class="service"/>
  <text x="1290" y="608" class="service-title">DynamoDB application table</text>
  <text x="1290" y="628" class="service-detail">optional key-value + TTL</text>
  <text x="1290" y="643" class="access-detail">worker only</text>

  <rect x="1140" y="663" width="300" height="68" rx="9" class="service"/>
  <text x="1290" y="690" class="service-title">SQS + EventBridge</text>
  <text x="1290" y="710" class="service-detail">optional trigger and response paths</text>
  <text x="1290" y="725" class="access-detail">gateway ingress · worker dispatch</text>

  <rect x="1140" y="745" width="300" height="68" rx="9" class="service"/>
  <text x="1290" y="772" class="service-title">CloudWatch + ECS control</text>
  <text x="1290" y="792" class="service-detail">logs · metrics · service rollout</text>
  <text x="1290" y="807" class="access-detail">all tasks · activation controller</text>

  <g transform="translate(30 870)">
    <line x1="0" y1="0" x2="42" y2="0" class="data-edge"/>
    <text x="55" y="5" class="legend">runtime/data path</text>
    <line x1="205" y1="0" x2="247" y2="0" class="control-edge"/>
    <text x="260" y="5" class="legend">control/API path</text>
    <text x="430" y="5" class="legend">Regional service labels state the permitted consumers.</text>
  </g>
</svg>
